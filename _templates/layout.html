{% extends "!layout.html" %}

{% block extrahead %}
    <link href="{{ pathto("_static/style.css", True) }}" rel="stylesheet" type="text/css">
{% endblock %}

{% block document %}
<!-- 全局中英文切换按钮（所有页面顶部自动显示） -->
<div style="text-align: right; margin-bottom: 20px;">
  <button id="langBtn" style="padding: 8px 16px; background: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size:14px; transition: all 0.1s ease; font-weight: bold;">
    Switch to English
  </button>
</div>

<script>
  const btn = document.getElementById('langBtn');
  const path = window.location.pathname;

  // 自动判断语言显示按钮文字
  if (path.includes('/zh/')) {
    btn.innerText = '中 / EN';
  } else if (path.includes('/en/')) {
    btn.innerText = 'EN / 中';
  }

  // 鼠标悬浮：高亮非常明显 + 放大 + 加深底色
  btn.addEventListener('mouseenter', () => {
    btn.style.background = '#005999';
    btn.style.transform = 'scale(1.08)';
    btn.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
  });
  // 鼠标离开恢复原样
  btn.addEventListener('mouseleave', () => {
    btn.style.background = '#2980b9';
    btn.style.transform = 'scale(1)';
    btn.style.boxShadow = 'none';
  });

  // 点击跳转
  btn.addEventListener('click', () => {
    if (path.includes('/zh/')) {
      window.location.href = "/en/index.html";
    } else {
      window.location.href = "/zh/index.html";
    }
  });
</script>

{{ super() }}
{% endblock %}
