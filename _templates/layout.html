{% extends "!layout.html" %}

{% block extrahead %}
    <link href="{{ pathto("_static/style.css", True) }}" rel="stylesheet" type="text/css">
{% endblock %}

{% block document %}
<!-- 全局中英文切换按钮（所有页面顶部自动显示） -->
<div style="text-align: right; margin-bottom: 20px;">
  <button id="langBtn" style="padding: 8px 16px; background: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size:14px; transition: all 0.1s ease; font-weight: bold;">
    中 / EN
  </button>
</div>

<script>
document.addEventListener('DOMContentLoaded', function(){
    const btn = document.getElementById('langBtn');
    const path = window.location.pathname;
    const isProd = path.includes('/latest/');
    const hasZh = path.includes('/zh/');
    const hasEn = path.includes('/en/');

    // 按钮文字
    if (hasZh) {
        btn.innerText = '中 / EN';
    } else if (hasEn) {
        btn.innerText = 'EN / 中';
    } else {
        btn.innerText = '中 / EN';
    }

    // 悬浮样式
    btn.onmouseenter = function(){
        this.style.background = '#005999';
        this.style.transform = 'scale(1.08)';
        this.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
    };
    btn.onmouseleave = function(){
        this.style.background = '#2980b9';
        this.style.transform = 'scale(1)';
        this.style.boxShadow = 'none';
    };

    btn.onclick = function(){
        let targetUrl;

        // 优先判断环境：本地 / 生产
        if (!isProd) {
            // 本地环境
            if (path === '/' || hasZh) {
                // 根目录 或 当前中文 → 跳英文首页
                targetUrl = '/en/index.html';
            } else {
                // 当前英文 → 跳中文首页
                targetUrl = '/zh/index.html';
            }
        } else {
            // 生产环境(RTD)
            if (path === '/' || hasZh) {
                // 根目录 或 当前中文 → 跳英文首页
                targetUrl = '/zh-cn/latest/en/index.html';
            } else {
                // 当前英文 → 跳中文首页
                targetUrl = '/zh-cn/latest/zh/index.html';
            }
        }

        location.href = targetUrl;
    };
});
</script>

{{ super() }}
{% endblock %}
