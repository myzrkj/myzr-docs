version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools
    - pip install -r requirements.txt
    - pip install .

    # 直接编译到 zh / en
    - sphinx-build -b html -c . zh $READTHEDOCS_OUTPUT/html/zh
    - sphinx-build -b html -c . en $READTHEDOCS_OUTPUT/html/en

    # 创建空 index.html
    - touch $READTHEDOCS_OUTPUT/html/index.html