version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools
    - pip install -r requirements.txt
    - pip install .

    # 直接编译中英文到 RTD 官方目录
    - sphinx-build -b html -c . zh "$READTHEDOCS_OUTPUT/html/zh"
    - sphinx-build -b html -c . en "$READTHEDOCS_OUTPUT/html/en"

    # 最安全的跳转首页（不会报错）
    - sh -c 'printf "<meta http-equiv=\"refresh\" content=\"0;url=zh/index.html\">" > "$READTHEDOCS_OUTPUT/html/index.html"'