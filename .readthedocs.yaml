version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools wheel
    - pip install -r requirements.txt
    - pip install .

    # 构建中英文
    - sphinx-build -b html -c ./ ./zh "${READTHEDOCS_OUTPUT}/html"
    - sphinx-build -b html -c ./ ./en "${READTHEDOCS_OUTPUT}/html/en"

sphinx:
  fail_on_warning: false