version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools
    - pip install -r requirements.txt
    - pip install .

    - sphinx-build -b html -c . zh $READTHEDOCS_OUTPUT/html/zh_cn/latest
    - sphinx-build -b html -c . en $READTHEDOCS_OUTPUT/html/en/latest

    - touch $READTHEDOCS_OUTPUT/html/index.html