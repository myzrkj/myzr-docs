version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools
    - pip install -r requirements.txt
    - pip install .

    # 编译中英文
    - sphinx-build -b html -c . zh $READTHEDOCS_OUTPUT/html/zh
    - sphinx-build -b html -c . en $READTHEDOCS_OUTPUT/html/en

    # 创建首页跳转
    - echo x > $READTHEDOCS_OUTPUT/html/index.html