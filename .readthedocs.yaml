version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - set -e
    - pip install -U pip setuptools wheel
    - pip install -r requirements.txt
    - pip install .

    # 构建中英文
    - sphinx-build -b html -c ./ ./zh "${READTHEDOCS_OUTPUT}/html/zh"
    - sphinx-build -b html -c ./ ./en "${READTHEDOCS_OUTPUT}/html/en"

    - cd "${READTHEDOCS_OUTPUT}/html"
    # 只拷贝文件，不覆盖已有目录
    - find zh -maxdepth 1 -type f -exec cp -f {} ./ \;
    # 拷贝根目录隐藏文件 .js/.css/.ico
    - find zh -maxdepth 1 -type f -name ".*" -exec cp -f {} ./ \;

sphinx:
  fail_on_warning: false