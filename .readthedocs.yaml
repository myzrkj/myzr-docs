# .readthedocs.yaml
# Read the Docs configuration file
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install --upgrade pip setuptools
    - pip install -r requirements.txt
    - pip install .

    # 清理旧文件
    - rm -rf _doctree _build html .doctree

    # 编译中英文
    - sphinx-build -b html -c . zh html/zh
    - sphinx-build -b html -c . en html/en

    # 复制到 Read the Docs 输出目录
    - mkdir -p _readthedocs/html
    - cp -r html/* _readthedocs/html/

    # ✅ 关键修复：创建根目录 index.html 自动跳转中文
    - echo '<meta http-equiv="refresh" content="0;url=zh/index.html">' > _readthedocs/html/index.html

# 自定义命令模式下，这两项必须删除，否则会冲突
sphin: false
python: false