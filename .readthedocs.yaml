version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  commands:
    - pip install -U pip setuptools
    - pip install -r requirements.txt
    - pip install .

    - rm -rf $READTHEDOCS_OUTPUT/_doctree/
    - rm -rf $READTHEDOCS_OUTPUT/_build/
    - rm -rf $READTHEDOCS_OUTPUT/html/
    - rm -rf $READTHEDOCS_OUTPUT/.doctree/

    - sphinx-build -b html -c . zh $READTHEDOCS_OUTPUT/html/zh
    - sphinx-build -b html -c . en $READTHEDOCS_OUTPUT/html/en

    - ln -s $READTHEDOCS_OUTPUT/html/zh/{*,.[^.]*} $READTHEDOCS_OUTPUT/html/